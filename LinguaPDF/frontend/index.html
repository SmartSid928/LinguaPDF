
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinguaPDF | PDF Translator</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>LinguaPDF</h1>
        <p>Translate your documents without boundaries.</p>
    </header>

    <main class="container">

        <section class="upload-card">

            <h2>Translate your PDF</h2>

            <p class="description">
                Upload your PDF document to get started.
            </p>

            <div class="upload-area" id="uploadArea">

                <div class="upload-icon">📄</div>

                <h3>Drop your PDF here</h3>

                <p>or select a file from your device</p>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                    hidden
                >

                <button id="chooseBtn">
                    Choose PDF
                </button>

                <p class="file-limit">
                    PDF files only · Maximum 20 MB
                </p>

            </div>

            <div id="fileInfo" class="file-info"></div>

            <button id="uploadBtn" class="translate-btn" disabled>
                Upload and Extract Text
            </button>

            <div id="progress" class="progress"></div>

            <div id="result" class="result"></div>

        </section>

    </main>

    <script src="/static/script.js"></script>

</body>
</html>
